<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>童童暑假复习巩固营 · CM1→CM2 · L'île aux Coquelicots</title>
<meta name="description" content="童童 CM1→CM2 暑假30天复习巩固学习平台 — 法语·数学·科学·历史地理·英语">

<style>
/* ==== style.css ==== */
/* ===== 童童暑假复习巩固营 · Design System ===== */
:root{
  --coq:#E8503A; --coq-d:#C93A26; --coq-l:#FDEAE6;
  --sky:#3D8BFD; --sky-l:#E7F0FF;
  --leaf:#2E8B62; --leaf-l:#E3F4EC;
  --sun:#FFB53D; --sun-l:#FFF3DC;
  --viol:#8B5CF6; --viol-l:#F0EAFE;
  --ink:#2B2320; --ink2:#6B5F58; --line:#EFE4D8;
  --bg:#FFF8EE; --card:#FFFFFF;
  --ok:#27AE60; --bad:#E74C3C;
  --r:18px; --sh:0 4px 16px rgba(90,60,30,.08), 0 1px 3px rgba(90,60,30,.06);
  --fs:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Nunito","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit}
#app{max-width:900px;margin:0 auto;padding:12px 14px 90px}
.hidden{display:none!important}

/* header */
.topbar{display:flex;align-items:center;gap:10px;padding:10px 2px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo .pop{font-size:1.9rem;filter:drop-shadow(0 2px 2px rgba(0,0,0,.12))}
.logo b{font-size:1.12rem;line-height:1.15;display:block}
.logo small{color:var(--ink2);font-size:.74rem;display:block}
.topbtns{margin-left:auto;display:flex;gap:8px}
.iconbtn{border:2px solid var(--line);background:var(--card);border-radius:12px;min-width:42px;height:42px;
  font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 10px;
  transition:.15s;color:var(--ink)}
.iconbtn:hover{border-color:var(--coq);transform:translateY(-1px)}
.iconbtn.act{background:var(--coq);border-color:var(--coq);color:#fff}

/* cards & layout */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin:12px 0;border:1px solid rgba(0,0,0,.02)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.grow{flex:1 1 180px}
h2.sec{font-size:1.05rem;margin:20px 4px 6px;display:flex;align-items:center;gap:8px}
.muted{color:var(--ink2)}
.small{font-size:.85rem}
.center{text-align:center}

/* hero stats */
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 8px;text-align:center}
.stat .n{font-size:1.45rem;font-weight:800;line-height:1.1}
.stat .l{font-size:.72rem;color:var(--ink2);margin-top:2px}
.levelbar{height:10px;background:var(--sun-l);border-radius:99px;overflow:hidden;margin-top:6px}
.levelbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--coq));border-radius:99px;transition:width .6s}

/* today card */
.today{background:linear-gradient(135deg,#FF8A65 0%,var(--coq) 60%,#C62F55 100%);color:#fff;position:relative;overflow:hidden}
.today .deco{position:absolute;right:-18px;top:-18px;font-size:6.2rem;opacity:.18;transform:rotate(12deg)}
.today h3{margin:0 0 4px;font-size:1.25rem}
.today .sub{opacity:.92;font-size:.9rem}
.bigbtn{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--coq-d);font-weight:800;
  border:none;border-radius:14px;padding:13px 26px;font-size:1.05rem;cursor:pointer;margin-top:14px;
  box-shadow:0 4px 12px rgba(0,0,0,.18);transition:.15s}
.bigbtn:hover{transform:translateY(-2px) scale(1.02)}
.bigbtn.alt{background:var(--coq);color:#fff}
.bigbtn:disabled{opacity:.55;cursor:not-allowed;transform:none}

/* adventure map */
.map{position:relative;padding:6px 0 2px}
.weekband{margin:14px 0 6px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:.95rem}
.weekband .tag{font-size:.72rem;color:#fff;border-radius:99px;padding:2px 10px}
.isles{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media(max-width:560px){.isles{grid-template-columns:repeat(4,1fr)}}
.isle{position:relative;aspect-ratio:1;border-radius:16px;border:2px solid var(--line);background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.15s;padding:2px}
.isle:hover{transform:translateY(-2px)}
.isle .d{font-size:.68rem;color:var(--ink2)}
.isle .ic{font-size:1.35rem;line-height:1.2}
.isle .st{font-size:.6rem;letter-spacing:1px;color:var(--sun);height:.9em}
.isle.done{border-color:var(--leaf);background:var(--leaf-l)}
.isle.next{border-color:var(--coq);background:var(--coq-l);animation:pulse 1.8s infinite}
.isle.lock{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,80,58,.35)}50%{box-shadow:0 0 0 8px rgba(232,80,58,0)}}

/* session */
.sess-top{display:flex;align-items:center;gap:10px;margin:8px 0}
.pbar{flex:1;height:14px;background:#F3E8DA;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--coq));transition:width .35s;border-radius:99px}
.quit{border:none;background:none;font-size:1.2rem;cursor:pointer;color:var(--ink2)}
.blockchip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 12px;font-size:.8rem;font-weight:700;color:#fff}
.qcard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin:10px 0;animation:slidein .3s}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.qtext{font-size:1.16rem;font-weight:700;margin:6px 0 4px;line-height:1.5}
.qtext .blank{display:inline-block;min-width:56px;border-bottom:3px solid var(--sky);color:var(--sky);text-align:center;font-weight:800}
.qzh{color:var(--ink2);font-size:.86rem;margin-bottom:8px}
.opts{display:grid;gap:10px;margin-top:14px}
.opts.two{grid-template-columns:1fr 1fr}
@media(max-width:480px){.opts.two{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:13px 16px;font-size:1.02rem;text-align:left;
  cursor:pointer;transition:.13s;font-weight:600;color:var(--ink)}
.opt:hover{border-color:var(--sky);background:var(--sky-l)}
.opt.sel{border-color:var(--sky);background:var(--sky-l)}
.opt.ok{border-color:var(--ok);background:#E9F9EF;animation:pop .3s}
.opt.bad{border-color:var(--bad);background:#FDEDEB;animation:shake .35s}
.opt:disabled{cursor:default;opacity:.75}
.opt.ok:disabled,.opt.bad:disabled{opacity:1}
@keyframes pop{50%{transform:scale(1.045)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* text input */
.inpwrap{margin-top:14px}
.tinp{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 16px;font-size:1.1rem;font-family:inherit;font-weight:600}
.tinp:focus{outline:none;border-color:var(--sky)}
.tinp.ok{border-color:var(--ok);background:#E9F9EF}
.tinp.bad{border-color:var(--bad);background:#FDEDEB;animation:shake .35s}
.accbar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.acc{border:1.5px solid var(--line);background:#fff;border-radius:10px;min-width:38px;height:38px;font-size:1.02rem;cursor:pointer}
.acc:hover{background:var(--sky-l);border-color:var(--sky)}
.multiwrap{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.multiwrap .mf{flex:1 1 130px}
.multiwrap label{font-size:.8rem;color:var(--ink2);font-weight:700;display:block;margin-bottom:4px}

/* match */
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mitem{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;cursor:pointer;font-weight:600;
  text-align:center;transition:.13s;font-size:.98rem;color:var(--ink)}
.mitem.sel{border-color:var(--sky);background:var(--sky-l);transform:scale(1.03)}
.mitem.paired{cursor:default;color:#fff;border-color:transparent}
.mitem.bad{animation:shake .35s;border-color:var(--bad)}

/* order */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;cursor:pointer;font-weight:600;font-size:.95rem;transition:.13s;color:var(--ink)}
.chip:hover{border-color:var(--viol);background:var(--viol-l)}
.chip.used{opacity:.35;cursor:default}
.orderzone{min-height:52px;border:2px dashed var(--line);border-radius:12px;margin-top:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ochip{background:var(--viol-l);border:2px solid var(--viol);border-radius:10px;padding:7px 11px;font-weight:700;font-size:.9rem;cursor:pointer}
.ozhint{color:var(--ink2);font-size:.85rem;padding:4px 8px}

/* dictée */
.speakbtn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--sky);background:var(--sky-l);color:var(--sky);
  border-radius:14px;padding:11px 20px;font-size:1rem;font-weight:800;cursor:pointer;margin:6px 6px 0 0}
.speakbtn:hover{background:var(--sky);color:#fff}
.memoline{font-size:1.2rem;font-weight:800;letter-spacing:.4px;background:var(--sun-l);border-radius:12px;padding:12px 16px;margin-top:10px;text-align:center}

/* feedback */
.fb{border-radius:14px;padding:13px 16px;margin-top:14px;font-size:.95rem;animation:slidein .25s}
.fb.good{background:#E9F9EF;border:2px solid #b7e6c6}
.fb.hint{background:var(--sun-l);border:2px solid #f2d9a4}
.fb.bad{background:#FDEDEB;border:2px solid #f3c1ba}
.fb b.res{display:block;font-size:1.02rem;margin-bottom:3px}
.nextbtn{display:block;width:100%;margin-top:14px;border:none;border-radius:14px;background:var(--ink);color:#fff;
  font-size:1.05rem;font-weight:800;padding:14px;cursor:pointer;transition:.15s}
.nextbtn:hover{transform:translateY(-1px);background:#000}
.checkbtn{background:var(--sky)}
.checkbtn:hover{background:#2b6fd8}

/* lesson card */
.lesson{background:linear-gradient(135deg,#FFFBF2,#FFF3E0);border:2px solid #F5E3C2}
.lesson h3{margin:2px 0 8px;font-size:1.15rem}
.lesson .rule{background:#fff;border-radius:12px;padding:12px 14px;margin:9px 0;border-left:5px solid var(--sun)}
.lesson .rule b.fr{color:var(--coq-d)}
.lesson .memo{background:var(--coq-l);border-left-color:var(--coq);font-weight:600}
.lesson .ex{color:var(--ink2);font-size:.92rem;margin-top:3px}
.lesson table{border-collapse:collapse;width:100%;margin:8px 0;background:#fff;border-radius:10px;overflow:hidden;font-size:.95rem}
.lesson th,.lesson td{border:1px solid var(--line);padding:7px 10px;text-align:center}
.lesson th{background:var(--sun-l)}

/* results */
.scorewrap{text-align:center;padding:10px 0}
.scircle{width:150px;height:150px;margin:8px auto;position:relative}
.scircle svg{transform:rotate(-90deg)}
.scircle .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scircle .val b{font-size:2.2rem;line-height:1}
.stars{font-size:2.1rem;letter-spacing:6px;margin:4px 0}
.gain{display:inline-block;background:var(--sun-l);border-radius:99px;padding:5px 16px;font-weight:800;color:#B07A1E;margin:4px}
.breakdown{display:grid;gap:8px;margin-top:8px}
.bd{display:flex;align-items:center;gap:10px;background:#FDFAF4;border-radius:12px;padding:9px 12px;font-size:.92rem}
.bd .bar{flex:1;height:9px;background:#eee4d6;border-radius:99px;overflow:hidden}
.bd .bar i{display:block;height:100%;border-radius:99px}
.recap{font-size:.9rem}
.recap .wrongitem{background:#FFF6F4;border-radius:10px;padding:8px 12px;margin:6px 0;border-left:4px solid var(--coq)}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:14px 10px;text-align:center;transition:.2s}
.badge .bic{font-size:2.3rem;line-height:1.2;display:block}
.badge.off{filter:grayscale(1);opacity:.45}
.badge b{font-size:.85rem;display:block;margin-top:4px}
.badge small{color:var(--ink2);font-size:.7rem;display:block;line-height:1.3;margin-top:2px}
.badge.new{animation:pop .5s;box-shadow:0 0 0 3px var(--sun)}

/* mission */
.mission{background:linear-gradient(135deg,#EFFBF4,#DFF5E9);border:2px solid #BFE8D2}
.mission h3{margin:0 0 6px}
.mission li{margin:6px 0}

/* parent */
.pin{display:flex;gap:10px;justify-content:center;margin:16px 0}
.pin input{width:150px;text-align:center;font-size:1.5rem;letter-spacing:8px;border:2px solid var(--line);border-radius:14px;padding:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tab{border:2px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--ink)}
.tab.act{background:var(--ink);border-color:var(--ink);color:#fff}
.cal{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
@media(max-width:560px){.cal{grid-template-columns:repeat(6,1fr)}}
.cd{aspect-ratio:1;border-radius:8px;background:#F3EADD;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;color:var(--ink2)}
.cd b{font-size:.82rem;color:var(--ink)}
.comprow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.88rem}
.comprow .nm{flex:1 1 200px}
.comprow .bar{flex:1 1 120px;height:10px;background:#efe6d8;border-radius:99px;overflow:hidden}
.comprow .bar i{display:block;height:100%;border-radius:99px}
.gpill{font-size:.68rem;font-weight:800;border-radius:99px;padding:2px 8px;color:#fff;min-width:34px;text-align:center}
.logitem{background:#FDFAF4;border-radius:10px;padding:9px 12px;margin:7px 0;font-size:.88rem}
.logitem .g{color:var(--bad);font-weight:700}
.logitem .a{color:var(--ok);font-weight:700}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.cf{position:absolute;top:-14px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:99px;
  padding:11px 22px;font-weight:700;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:slidein .3s;font-size:.92rem;max-width:88vw;text-align:center}

/* diploma */
.diploma{border:6px double var(--coq);border-radius:14px;padding:30px 22px;text-align:center;background:#FFFDF6}
.diploma h1{color:var(--coq-d);margin:4px 0;font-size:1.6rem}
.diploma .nm{font-size:1.8rem;font-weight:900;margin:10px 0;color:var(--ink)}
@media print{
  body *{visibility:hidden}
  .diploma,.diploma *{visibility:visible}
  .diploma{position:fixed;inset:14px;border-color:#C93A26}
}

/* settings */
.setrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.setrow .lbl{flex:1;font-weight:700;min-width:150px}
.setrow .lbl small{display:block;font-weight:400;color:var(--ink2)}
.sbtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:.9rem;color:var(--ink)}
.sbtn:hover{border-color:var(--sky)}
.sbtn.warn{color:var(--bad);border-color:#f3c1ba}

footer{margin-top:26px;text-align:center;color:var(--ink2);font-size:.75rem;padding-bottom:10px}

</style>
</head>

/* ---------- Imparfait 生成器 ---------- */
const IMP_END = ["ais", "ais", "ait", "ions", "iez", "aient"];
const IMP_PRON = ["je", "tu", "il", "nous", "vous", "elles"];
const IMP_PRON2 = ["je", "tu", "elle", "nous", "vous", "ils"];
/* soft=true: -ger 动词,在 a 开头词尾前保留 e */
const V1 = [
  { inf: "chanter", st: "chant" }, { inf: "jouer", st: "jou" }, { inf: "danser", st: "dans" },
  { inf: "regarder", st: "regard" }, { inf: "manger", st: "mang", soft: true }, { inf: "nager", st: "nag", soft: true },
  { inf: "dessiner", st: "dessin" }, { inf: "parler", st: "parl" }, { inf: "habiter", st: "habit" },
  { inf: "commencer", st: "commen", ced: true }, { inf: "lancer", st: "lan", ced: true }, { inf: "travailler", st: "travaill" },
];
const V2 = [
  { inf: "finir", st: "finiss" }, { inf: "choisir", st: "choisiss" }, { inf: "grandir", st: "grandiss" },
  { inf: "rougir", st: "rougiss" }, { inf: "réussir", st: "réussiss" }, { inf: "remplir", st: "rempliss" },
];
const V3 = [
  { inf: "faire", st: "fais" }, { inf: "aller", st: "all" }, { inf: "dire", st: "dis" },
  { inf: "voir", st: "voy" }, { inf: "venir", st: "ven" }, { inf: "prendre", st: "pren" },
  { inf: "vouloir", st: "voul" }, { inf: "pouvoir", st: "pouv" }, { inf: "boire", st: "buv" },
  { inf: "écrire", st: "écriv" }, { inf: "lire", st: "lis" }, { inf: "partir", st: "part" },
  { inf: "être", st: "ét" }, { inf: "avoir", st: "av" },
];
function conjImp(v, pi) {
  let st = v.st;
  const end = IMP_END[pi];
  if (v.soft && end[0] === "a") st = st + "e";       // mangeais
  if (v.ced && end[0] === "a") st = st + "ç";        // commençais
  if (v.ced && end[0] === "i") st = st + "c";        // commencions
  let pron = (Math.random() < .5 ? IMP_PRON : IMP_PRON2)[pi];
  let form = st + end;
  if (pron === "je" && /^[aeéiouh]/.test(form)) pron = "j'";
  return { pron, form };
}
function genImp(pool, label) {
  const v = pick(pool);
  const pi = rndi(0, 5);
  const { pron, form } = conjImp(v, pi);
  const sep = pron.endsWith("'") ? "" : " ";
  if (Math.random() < 0.5) {
    const wrongs = new Set();
    while (wrongs.size < 2) {
      const w = pick([v.st + pick(IMP_END.filter((e) => e !== IMP_END[pi])), v.st + (IMP_END[pi] === "ait" ? "aient" : "ait"), v.st + "e" + IMP_END[pi]]);
      if (w !== form) wrongs.add(w);
    }
    const opts = shuffle([form, ...wrongs]);
    return { type: "qcm", q: `Imparfait : ${pron}${sep}___ (${v.inf})`, opts, a: opts.indexOf(form), exp: `${v.inf} → ${pron}${sep}${form}。词尾:-ais, -ais, -ait, -ions, -iez, -aient。` };
  }
  return { type: "input", q: `Écris à l'imparfait : ${pron}${sep}___ (${v.inf})`, acc: [form], exp: `${pron}${sep}${form}(${label})`, qzh: "写出 imparfait 变位" };
}
BANKS.fr_imp_1 = { gen: () => genImp(V1, "1er groupe") };

  const kind = pick(["double", "moitie", "triple", "tiers", "quadruple", "quart"]);
  let n, ans, q;
  switch (kind) {
    case "double": n = rndi(13, 480); ans = n * 2; q = `Le double de ${n} ?`; break;
    case "moitie": ans = rndi(7, 240); n = ans * 2; q = `La moitié de ${n} ?`; break;
    case "triple": n = rndi(4, 60); ans = n * 3; q = `Le triple de ${n} ?`; break;
    case "tiers": ans = rndi(3, 50); n = ans * 3; q = `Le tiers de ${n} ?`; break;
    case "quadruple": n = rndi(3, 50); ans = n * 4; q = `Le quadruple de ${n} ?`; break;
    default: ans = rndi(3, 50); n = ans * 4; q = `Le quart de ${n} ?`; break;
  }
  return { type: "input", q: "🧠 " + q, acc: [String(ans)], num: true, exp: q.replace(" ?", "") + " = " + ans, qzh: { double: "两倍", moitie: "一半", triple: "三倍", tiers: "三分之一", quadruple: "四倍", quart: "四分之一" }[kind] };
} };

/* ---------- 十进分数 ↔ 小数 (A/ECA) ---------- */
BANKS.ma_frac_dec = { gen: () => {
  const mode = rndi(0, 3);
  if (mode === 0) { // fraction → décimal
    const den = pick([10, 100]);
    const num = den === 10 ? rndi(11, 99) : rndi(101, 999);
    const ans = num / den;
    return { type: "input", q: `Écris en nombre décimal : <b>${num}/${den}</b>`, acc: [frNum(ans)], num: true, exp: `${num}/${den} = ${frNum(ans)}(除以 ${den},逗号左移)。`, qzh: "写成小数(用逗号)" };
  }
  if (mode === 1) { // décimal → fraction
    const den = pick([10, 100]);
    const num = den === 10 ? rndi(11, 99) : rndi(101, 999);
    const dec = frNum(num / den);
    const opts = shuffle([`${num}/${den}`, `${num}/${den === 10 ? 100 : 10}`, `${num * 10}/${den}`]);
    return { type: "qcm", q: `${dec} en fraction décimale :`, opts, a: opts.indexOf(`${num}/${den}`), exp: `${dec} = ${num}/${den}` };
  }
  if (mode === 2) { // lecture
    const u = rndi(1, 9); let d = rndi(1, 9); if (d === u) d = (d % 9) + 1;
    const words = ["", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf"];
    const q = `« ${words[u]} unités et ${words[d]} dixièmes » s'écrit :`;
    const good = `${u},${d}`;
    const opts = shuffle([good, `${d},${u}`, `${u},0${d}`]);
    return { type: "qcm", q, opts, a: opts.indexOf(good), exp: `${words[u]} unités et ${words[d]} dixièmes = ${good}`, qzh: "几个整数单位和几个十分位" };
  }
  const a2 = rndi(1, 9), b2 = rndi(0, 9), c2 = rndi(1, 9); // centièmes
  const val = (a2 + b2 / 10 + c2 / 100).toFixed(2);
  return { type: "input", q: `${a2} + ${b2}/10 + ${c2}/100 = ? (nombre décimal)`, acc: [frNum(val)], num: true, exp: `= ${frNum(val)}`, qzh: "算出小数(用逗号)" };
} };

/* ---------- 分解十进分数 (ECA 薄弱) ---------- */
BANKS.ma_frac_decomp = { gen: () => {
  const mode = rndi(0, 2);
  if (mode === 0) {
    const e = rndi(2, 9); let d = rndi(1, 9); if (d === e) d = (d % 9) + 1;
    const num = e * 10 + d;
    const good = `${e} + ${d}/10`;
    const opts = shuffle([good, `${d} + ${e}/10`, `${e} + ${d}/100`]);
    return { type: "qcm", q: `Décompose : <b>${num}/10</b> =`, opts, a: opts.indexOf(good), exp: `${num}/10 = ${e * 10}/10 + ${d}/10 = ${good}`, qzh: "分解十进分数" };
  }
  if (mode === 1) {
    const e = rndi(1, 9), d = rndi(1, 9), c = rndi(1, 9);
    const num = e * 100 + d * 10 + c;
    return { type: "multi", q: `Complète : <b>${num}/100</b> = ▢ + ▢/10 + ▢/100`, fields: [{ label: "▢ (unités)", a: String(e), num: true }, { label: "▢/10", a: String(d), num: true }, { label: "▢/100", a: String(c), num: true }], exp: `${num}/100 = ${e} + ${d}/10 + ${c}/100`, qzh: "填三个空" };
  }
  const e = rndi(1, 9), d = rndi(1, 9);
  const val = frNum(e + d / 10);
  return { type: "input", q: `${val} = ${e} + ▢/10 · Que vaut ▢ ?`, acc: [String(d)], num: true, exp: `${val} = ${e} + ${d}/10`, qzh: "十分位上是几?" };
} };

/* ---------- 数轴 droite graduée (A 维持) ---------- */
BANKS.ma_droite = { gen: () => {
  const base = rndi(0, 7);                     // 整数起点
  const marks = [];                            // 4 个字母点,十分位
  const used = new Set();
  while (marks.length < 4) { const d = rndi(1, 19); if (!used.has(d)) { used.add(d); marks.push(d); } }
  marks.sort((a, b) => a - b);
  const letters = ["A", "B", "C", "D"];
  const idx = rndi(0, 3);
  const val = frNum(base + marks[idx] / 10);
  const line = { min: base, max: base + 2, ticks: 10, points: marks.map((m, i) => ({ v: base + m / 10, label: letters[i] })) };
  if (Math.random() < 0.5)
    return { type: "qcm", q: `Quelle lettre est placée sur <b>${val}</b> ?`, opts: letters, a: idx, line, exp: `${letters[idx]} = ${val}(每小格 = 1/10)`, qzh: "看数轴选字母" };
  return { type: "qcm", q: `Quel nombre correspond à la lettre <b>${letters[idx]}</b> ?`, opts: shuffleWith(marks.map((m) => frNum(base + m / 10)), idx), a: -1, line, _fix: { vals: marks.map((m) => frNum(base + m / 10)), idx }, exp: `${letters[idx]} = ${val}`, qzh: "字母对应哪个数?" };
} };
/* 洗牌但记录正确项位置 */
function shuffleWith(arr, goodIdx) { return arr; } // 占位,由下方 normalizeDroite 处理
/* 修正 ma_droite 第二种模式的选项与答案 */
const _origDroiteGen = BANKS.ma_droite.gen;
BANKS.ma_droite.gen = () => {
  const it = _origDroiteGen();
  if (it._fix) {
    const { vals, idx } = it._fix;
    const good = vals[idx];
    const opts = shuffle([...new Set(vals)]);
    it.opts = opts; it.a = opts.indexOf(good);
    delete it._fix;
  }
  return it;
};

/* ---------- 比较小数 (A 维持) ---------- */
BANKS.ma_compare = { gen: () => {
  const e = rndi(1, 9);
  let x, y;
  if (Math.random() < 0.55) { // 经典陷阱:3,5 vs 3,45
    const d1 = rndi(1, 9); let d2 = rndi(10, 99);
    x = `${e},${d1}`; y = `${e},${String(d2).padStart(2, "0")}`;
  } else {
    x = `${e},${rndi(1, 9)}`; y = `${rndi(1, 9)},${rndi(1, 9)}`;
  }
  const vx = parseFloat(x.replace(",", ".")), vy = parseFloat(y.replace(",", "."));
  if (vx === vy) return BANKS.ma_compare.gen();
  const good = vx > vy ? ">" : "<";
  return { type: "qcm", q: `Compare : <b>${x}</b> ▢ <b>${y}</b>`, opts: ["<", ">", "="], a: good === "<" ? 0 : 1, exp: `${x} ${good} ${y}。比较小数:先看整数部分,再一位一位比小数(3,5 = 3,50)。`, qzh: "填 < > 还是 =" };
} };

/* ---------- CM2 预备:大数(百万) ---------- */
const NUM_WORDS = (n) => { /* 简版:仅用于选项呈现,不做完整法语数字拼写 */ return n.toLocaleString("fr-FR"); };
BANKS.ma_cm2_grands = { gen: () => {
  const mode = rndi(0, 2);
  if (mode === 0) {
    const n = rndi(100, 999) * 1000 + rndi(0, 999);
    const good = n.toLocaleString("fr-FR");
    const opts = shuffle([good, (n + rndi(1, 9) * 1000).toLocaleString("fr-FR"), (n * 10).toLocaleString("fr-FR")]);
    const words = frenchNumberWords(n);
    return { type: "qcm", q: `Écris en chiffres : « ${words} »`, opts, a: opts.indexOf(good), exp: `${words} = ${good}`, qzh: "CM2预备:大数读写" };
  }
  if (mode === 1) {
    const m = rndi(1, 9), k = rndi(100, 999), u = rndi(100, 999);
    const n = m * 1e6 + k * 1000 + u;
    return { type: "input", q: `${m} million${m > 1 ? "s" : ""} + ${k} milliers + ${u} unités = ▢`, acc: [String(n), n.toLocaleString("fr-FR")], num: true, exp: `= ${n.toLocaleString("fr-FR")}`, qzh: "CM2预备:按位组数(可以不打空格)" };
  }
  const a1 = rndi(100000, 9999999), b1 = rndi(100000, 9999999);
  if (a1 === b1) return BANKS.ma_cm2_grands.gen();
  const good = a1 > b1 ? ">" : "<";
  return { type: "qcm", q: `Compare : <b>${a1.toLocaleString("fr-FR")}</b> ▢ <b>${b1.toLocaleString("fr-FR")}</b>`, opts: ["<", ">"], a: good === "<" ? 0 : 1, exp: `位数相同先比最高位。答案:${good}`, qzh: "CM2预备:比大小" };
} };
function frenchNumberWords(n) {
  const units = ["", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf", "dix", "onze", "douze", "treize", "quatorze", "quinze", "seize"];
  const tens = { 10: "dix", 20: "vingt", 30: "trente", 40: "quarante", 50: "cinquante", 60: "soixante", 70: "soixante-dix", 80: "quatre-vingts", 90: "quatre-vingt-dix" };
  function below100(x) {
    if (x <= 16) return units[x];
    if (x < 20) return "dix-" + units[x - 10];
    const t = Math.floor(x / 10) * 10, r = x % 10;
    if (t === 70) return r === 1 ? "soixante-et-onze" : "soixante-" + below100(10 + r);
    if (t === 90) return "quatre-vingt-" + below100(10 + r);
    if (r === 0) return tens[t];
    if (t === 80) return "quatre-vingt-" + units[r];
    return tens[t] + (r === 1 ? "-et-un" : "-" + units[r]);
  }
  function below1000(x) {
    const h = Math.floor(x / 100), r = x % 100;
    let s = "";
    if (h === 1) s = "cent"; else if (h > 1) s = units[h] + "-cent" + (r === 0 ? "s" : "");
    if (r) s += (s ? "-" : "") + below100(r);
    return s || "zéro";
  }
  const mil = Math.floor(n / 1000), rest = n % 1000;
  let s = "";
  /* vingt/cent 后面还有数词(mille)时不加 s:quatre-vingt-mille, deux-cent-mille */
  if (mil === 1) s = "mille"; else if (mil > 1) s = below1000(mil).replace(/(vingt|cent)s$/, "$1") + "-mille";
  if (rest) s += (s ? "-" : "") + below1000(rest);
  return s;
}

/* ---------- CM2 预备:简单分数 ---------- */
BANKS.ma_cm2_frac = { gen: () => {
  const mode = rndi(0, 2);
  if (mode === 0) {
    const den = pick([2, 4, 3]), mult = rndi(2, 8);
    const n = den * mult;
    const label = den === 2 ? "la moitié" : den === 3 ? "le tiers" : "le quart";
    return { type: "input", q: `Combien vaut <b>1/${den}</b> de ${n} ? (${label})`, acc: [String(n / den)], num: true, exp: `1/${den} de ${n} = ${n} ÷ ${den} = ${n / den}`, qzh: "CM2预备:求几分之一" };
  }
  if (mode === 1) {
    const pairsEq = [["1/2", "2/4"], ["1/2", "5/10"], ["1/4", "25/100"], ["3/4", "75/100"], ["1/2", "50/100"], ["2/2", "1"]];
    const [x, y] = pick(pairsEq);
    const isEq = Math.random() < 0.6;
    if (isEq) return { type: "vf", q: `${x} = ${y} ?`, a: true, exp: `${x} = ${y},等值分数!`, qzh: "CM2预备:等值分数" };
    const wrong = pick(["1/3", "2/3", "4/5"]);
    return { type: "vf", q: `${x} = ${wrong} ?`, a: false, exp: `${x} ≠ ${wrong}。`, qzh: "CM2预备:等值分数" };
  }
  const num = rndi(1, 3);
  const pts = shuffle([{ v: num / 4, good: true }, { v: clamp(num / 4 + 0.25, 0.05, 0.95), good: false }, { v: clamp(num / 4 - 0.25, 0.05, 0.95), good: false }]);
  const letters = ["A", "B", "C"];
  const gi = pts.findIndex((p) => p.good);
  return { type: "qcm", q: `Sur la droite de 0 à 1, quelle lettre est sur <b>${num}/4</b> ?`, opts: letters, a: gi, line: { min: 0, max: 1, ticks: 4, points: pts.map((p, i) => ({ v: p.v, label: letters[i] })) }, exp: `${num}/4 = ${frNum(num / 4)}`, qzh: "CM2预备:数轴上的分数" };
} };

/* ---------- 小问题 problèmes (综合应用) ---------- */
const PROB_TPL = [
  () => { const p = rndi(3, 9), n = rndi(3, 8); return [`Un livre coûte ${p} €. Combien coûtent ${n} livres ?`, p * n, "€", `${n} × ${p} = ${p * n} €`]; },
  () => { const t = rndi(35, 95) * 2; return [`Papa coupe une baguette de ${t} cm en deux morceaux égaux. Longueur d'un morceau ?`, t / 2, "cm", `${t} ÷ 2 = ${t / 2} cm`]; },
  () => { const n = rndi(4, 9), per = rndi(6, 12); return [`Il y a ${n} boîtes de ${per} chocolats. Combien de chocolats en tout ?`, n * per, "chocolats", `${n} × ${per} = ${n * per}`]; },
  () => { const tot = rndi(5, 12) * 4; return [`${tot} élèves se rangent en 4 équipes égales. Combien par équipe ?`, tot / 4, "élèves", `${tot} ÷ 4 = ${tot / 4}`]; },
  () => { const a = rndi(150, 480), b = rndi(120, 400); return [`Tongtong a ${a + b} images. Elle en donne ${b}. Combien lui en reste-t-il ?`, a, "images", `${a + b} − ${b} = ${a}`]; },
  () => { const km = rndi(2, 6); return [`Une fourmi géante parcourt ${km} km. Combien de mètres ?`, km * 1000, "m", `${km} km = ${km * 1000} m`]; },
  () => { const d = rndi(3, 8); return [`Le rayon d'une roue est ${d} cm. Son diamètre ?`, d * 2, "cm", `2 × ${d} = ${d * 2} cm`]; },
  () => { const n = rndi(24, 60) * 2; return [`Un gâteau de ${n} fraises est partagé en deux. La moitié ?`, n / 2, "fraises", `${n} ÷ 2 = ${n / 2}`]; },
];
BANKS.ma_prob = { gen: () => { const [q, ans, unit, exp] = pick(PROB_TPL)(); return { type: "input", q: "🧩 " + q, acc: [String(ans)], num: true, exp: exp + (unit ? " (" + unit + ")" : ""), qzh: "读题,算一算(只填数字)" }; } };

/* ==== engine.js ==== */
/* ===== 核心引擎:状态·出题·评分·间隔复习·勋章·语音 ===== */

/* ---- 工具 ---- */
const $id = (i) => document.getElementById(i);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rndi = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
/* 答案比对:去首尾空格,压缩空格;重音敏感(拼写训练需要) */
const normAns = (s) => String(s).trim().replace(/\s+/g, " ").replace(/’/g, "'").toLowerCase();
/* 宽松比对(英语/无重音要求时) */
const normLoose = (s) => normAns(s).normalize("NFD").replace(/[̀-ͯ]/g, "");
/* 数字解析:接受法式逗号、空格/不换行空格分组 */
const parseNum = (s) => parseFloat(String(s).replace(/[\s  ]/g, "").replace(",", "."));

/* ---- 状态 ---- */
const STORE_KEY = "tt_camp_2026";
const DEFAULT_STATE = () => ({
  ver: 1, lang: "zh", sound: true, pin: "2016", firstOpen: todayStr(),
  xp: 0, days: {}, compStats: {}, usedIds: {}, badges: [], missions: {},
  streak: 0, maxStreak: 0, lastDoneDate: null, totalTime: 0,
});
let S = DEFAULT_STATE();
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { console.warn(e); } }
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) S = Object.assign(DEFAULT_STATE(), JSON.parse(raw)); } catch (e) { S = DEFAULT_STATE(); }
}
const t = (key, vars) => {
  let s = key.split(".").reduce((o, k) => (o || {})[k], I18N[S.lang]);
  if (s === undefined) s = key;
  if (vars) for (const k in vars) s = s.replace("{" + k + "}", vars[k]);
  return s;
};

/* ---- 掌握度模型 ---- */
const GRADE_VAL = { A: 88, ECA: 62, F: 38, I: 15 };
function compStat(cid) {
  if (!S.compStats[cid]) {
    const c = COMPS[cid] || {};
    S.compStats[cid] = { m: GRADE_VAL[c.g0 || "ECA"], seen: 0, ok: 0, ko: 0, lastKoDay: 0 };
  }
  return S.compStats[cid];
}
function recordAnswer(cid, credit, day) {
  const st = compStat(cid);
  st.seen++;
  if (credit >= 1) st.ok++; else if (credit <= 0) { st.ko++; st.lastKoDay = day; } else st.ok += 0.5;
  st.m = clamp(Math.round(st.m * 0.78 + credit * 100 * 0.22), 2, 100);
}

/* ---- 题目选取 ---- */
function takeFromBank(cid, n) {
  const bank = BANKS[cid];
  if (!bank) return [];
  const out = [];
  if (bank.gen) { for (let i = 0; i < n; i++) { const it = bank.gen(); it.comp = cid; it.uid = cid + "_g" + Math.random().toString(36).slice(2, 8); out.push(it); } return out; }
  if (!S.usedIds[cid]) S.usedIds[cid] = [];
  let fresh = bank.items.filter((it) => !S.usedIds[cid].includes(it.id));
  if (fresh.length < n) { S.usedIds[cid] = []; fresh = bank.items.slice(); }
  const chosen = shuffle(fresh).slice(0, n);
  chosen.forEach((it) => { S.usedIds[cid].push(it.id); });
  return chosen.map((it) => { const c = Object.assign({}, it); c.comp = cid; c.uid = it.id; return c; });
}
/* 热身:心算 + 闪卡 + 自适应弱点 */
function buildWarmup(day) {
  const items = [];
  const weak = Object.keys(S.compStats).filter((c) => S.compStats[c].seen >= 2 && S.compStats[c].m < 62 && BANKS[c]);
  const weakPick = shuffle(weak).slice(0, 2);
  weakPick.forEach((c) => { items.push(...takeFromBank(c, 1)); });
  const gens = ["ma_mental", "fr_flash", "ma_mental", "fr_flash", "ma_mental", "en_flash"];
  let gi = 0;
  while (items.length < 6 && gi < 12) { items.push(...takeFromBank(gens[gi % gens.length], 1)); gi++; }
  return shuffle(items).slice(0, 6);
}
/* 大挑战:间隔复习 — 优先近期错的 + 掌握度低的旧知识点 */
function buildDefi(day, excludeComps) {
  const past = new Set();
  PLAN.forEach((p) => { if (p.day <= day) p.blocks.forEach((b) => { if (b.comp && BANKS[b.comp] && !BANKS[b.comp].noReview) past.add(b.comp); }); });
  excludeComps.forEach((c) => past.delete(c));
  let pool = [...past];
  if (!pool.length) pool = [...excludeComps];
  const weighted = pool.map((c) => { const st = compStat(c); let w = 105 - st.m; if (st.lastKoDay && day - st.lastKoDay <= 3) w += 45; return { c, w: Math.max(w, 6) }; });
  const chosen = [];
  const target = Math.min(6, Math.max(3, pool.length));
  for (let i = 0; i < target && weighted.length; i++) {
    const tot = weighted.reduce((s, x) => s + x.w, 0);
    let r = Math.random() * tot, idx = 0;
    for (let j = 0; j < weighted.length; j++) { r -= weighted[j].w; if (r <= 0) { idx = j; break; } }
    chosen.push(weighted.splice(idx, 1)[0].c);
  }
  const items = [];
  chosen.forEach((c) => items.push(...takeFromBank(c, 1)));
  while (items.length < 6) items.push(...takeFromBank(pick(["ma_mental", "fr_flash"]), 1));
  return items.slice(0, 6);
}
/* 组装一天的课程 */
function buildSession(day) {
  const plan = PLAN.find((p) => p.day === day);
  const blocks = [];
  const coreComps = [];
  blocks.push({ kind: "warmup", label: t("warmup"), ic: "🔥", color: "var(--sun)", items: buildWarmup(day) });
  plan.blocks.forEach((b) => {
    if (b.kind === "core") {
      coreComps.push(b.comp);
      blocks.push({ kind: "core", comp: b.comp, lesson: b.lesson, label: t("core") + " · " + subjName(COMPS[b.comp].s), ic: SUBJ[COMPS[b.comp].s].ic, color: SUBJ[COMPS[b.comp].s].c, items: takeFromBank(b.comp, b.n || 7) });
    } else if (b.kind === "review") {
      const items = [];
      const comps = shuffle(b.comps.filter((c) => BANKS[c]));
      let i = 0;
      while (items.length < b.n && i < b.n * 3) { items.push(...takeFromBank(comps[i % comps.length], 1)); i++; }
      blocks.push({ kind: "core", review: true, label: t("reviewBlock"), ic: "🎲", color: "var(--sun)", items: shuffle(items).slice(0, b.n) });
    } else if (b.kind === "mission") {
      blocks.push({ kind: "mission", mission: b.mission, label: t("mission"), ic: "🛠️", color: "var(--leaf)", items: [] });
    }
  });
  blocks.push({ kind: "defi", label: t("defi"), ic: "🏆", color: "var(--viol)", items: buildDefi(day, coreComps) });
  return { day, plan, blocks };
}

/* ---- 答案判定 ---- */
function checkAnswer(item, given) {
  switch (item.type) {
    case "qcm": return given === item.a;
    case "vf": return given === item.a;
    case "input": case "dictee": {
      const accepted = item.acc || [];
      if (item.num) { const g = parseNum(given); return accepted.some((x) => Math.abs(parseNum(x) - g) < 1e-9); }
      let norm = item.loose ? normLoose : normAns;
      if (item.type === "dictee") { const base = norm; norm = (s) => base(s).replace(/[.,;:!?…«»"]/g, " ").replace(/\s+/g, " ").trim(); }
      const g = norm(given);
      return accepted.some((x) => norm(x) === g);
    }
    case "multi": return item.fields.every((f, i) => f.num ? Math.abs(parseNum(given[i]) - parseNum(f.a)) < 1e-9 : normAns(given[i]) === normAns(f.a));
    case "order": return given.join("|") === item.seq.map((x, i) => i).join("|");
    default: return false;
  }
}

/* ---- 每日完成 ---- */
function finishDay(day, result) {
  const dstr = todayStr();
  const prev = S.days[day];
  const isReplay = !!(prev && prev.done);
  const score = result.score;
  const stars = score >= 90 ? 3 : score >= 75 ? 2 : score >= 60 ? 1 : 0;
  let xpGain = isReplay ? Math.round(score * 0.2) : score;
  if (!isReplay) {
    if (stars === 3) xpGain += 20;
    if (score === 100) xpGain += 15;
  }
  S.xp += xpGain;
  if (!isReplay) {
    S.days[day] = { best: score, stars, date: dstr, time: result.time, wrong: result.wrong.slice(0, 40), done: true, plays: 1 };
    if (S.lastDoneDate) {
      const diff = Math.round((new Date(dstr) - new Date(S.lastDoneDate)) / 864e5);
      S.streak = diff === 1 ? S.streak + 1 : diff === 0 ? S.streak : 1;
    } else S.streak = 1;
    S.maxStreak = Math.max(S.maxStreak, S.streak);
    S.lastDoneDate = dstr;
  } else {

  }

}

let voiceFr = null, voiceEn = null;
function initVoices() {
  if (!("speechSynthesis" in window)) return;
  const setv = () => {
    const vs = speechSynthesis.getVoices();
    voiceFr = vs.find((v) => v.lang === "fr-FR" && /google|thomas|amelie|audrey/i.test(v.name)) || vs.find((v) => v.lang.startsWith("fr")) || null;
    voiceEn = vs.find((v) => v.lang.startsWith("en-GB")) || vs.find((v) => v.lang.startsWith("en")) || null;
  };
  setv();
  speechSynthesis.onvoiceschanged = setv;
}
function speak(text, opts = {}) {
  if (!("speechSynthesis" in window)) return false;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const en = opts.en;
  u.lang = en ? "en-GB" : "fr-FR";
  const v = en ? voiceEn : voiceFr;
  if (v) u.voice = v;
  u.rate = opts.slow ? 0.62 : 0.86;
  speechSynthesis.speak(u);

}

/* ---- 音效 (WebAudio,无外部文件) ---- */
let audioCtx = null;
function blip(kind) {
  if (!S.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const seqs = { ok: [[660, 0, .09], [880, .09, .12]], bad: [[220, 0, .18]], fanfare: [[523, 0, .12], [659, .12, .12], [784, .24, .12], [1047, .36, .3]], click: [[500, 0, .05]] };
    (seqs[kind] || []).forEach(([f, delay, dur]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = kind === "bad" ? "sawtooth" : "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.001, audioCtx.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + delay + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + delay); o.stop(audioCtx.currentTime + delay + dur + 0.05);
    });
  } catch (e) { }
}

function genReport() {

  const prog = deltas.filter((x) => x.d > 0).sort((a, b) => b.d - a.d).slice(0, 3);

function isleClick(d) {

function startDay(d) {
  sess = buildSession(d);

/* ---------- 课程流程 ---------- */
function curBlock() { return sess.blocks[sess.bi]; }
function curItem() { return curBlock().items[sess.qi]; }
function enterBlock() {
  const b = curBlock();
  if (!b) { return showResults(); }
  if (b.kind === "mission") { sess.phase = "mission"; renderMission(); return; }
  if (b.items.length === 0) { sess.bi++; return enterBlock(); }
  if (b.kind === "core" && b.lesson && LESSONS[b.lesson]) { sess.phase = "lesson"; renderLesson(); return; }
  sess.phase = "q"; sess.qi = 0; renderQuestion();
}
function nextQuestion() {
  sess.qi++;
  if (sess.qi >= curBlock().items.length) { sess.bi++; sess.qi = 0; enterBlock(); }
  else renderQuestion();
}
function sessHeader() {
  const answered = sess.blocks.slice(0, sess.bi).reduce((s, b) => s + b.items.length, 0) + sess.qi;
  const pct = sess.total ? Math.round(answered / sess.total * 100) : 0;
  const b = curBlock();
  return `<div class="sess-top">
    <button class="quit" onclick="quitSession()">✕</button>
    <div class="pbar"><i style="width:${pct}%"></i></div>
    <span class="blockchip" style="background:${b.color}">${b.ic} ${b.label}</span></div>`;
}
function quitSession() { if (confirm(S.lang === "zh" ? "要退出吗?本次进度不会保存。" : "Quitter ? La séance ne sera pas enregistrée.")) { sess = null; go("home"); } }

function renderLesson() {
  const b = curBlock();
  const Ls = LESSONS[b.lesson];
  let rules = Ls.rules.map((r) => `<div class="rule"><b class="fr">${r.fr}</b><div class="ex">${S.lang === "zh" ? esc(r.zh) : esc(r.frn || r.zh)}</div></div>`).join("");
  app.innerHTML = sessHeader() + `<div class="card lesson">
    <h3>💡 ${t("lesson")} · ${Ls.t[S.lang]}</h3>${Ls.cycle ? svgCycle() : ""}${rules}
    <div class="rule memo">${Ls.memo[S.lang]}</div>
    <button class="nextbtn" onclick="sess.phase='q';sess.qi=0;renderQuestion()">${t("next")}</button></div>`;
  window.scrollTo(0, 0);
}
function renderMission() {
  const b = curBlock();
  const m = MISSIONS[b.mission];
  const done = S.missions[m.key];
  app.innerHTML = sessHeader() + `<div class="card mission">
    <h3>${m.ic} ${t("mission")} · ${m.t[S.lang]}</h3>

      <button class="sbtn" onclick="sess.bi++;enterBlock()">${t("skip")} →</button></div></div>`;

function missionDone(key) {
  if (!S.missions[key]) { S.missions[key] = { done: true, date: todayStr() }; S.xp += 30; save(); blip("fanfare"); confetti(40); toast(t("missionDoneOk")); }
  sess.bi++; enterBlock();
}

/* ---------- 题目渲染 ---------- */
let qstate = null;
function renderQuestion() {
  const item = curItem();
  qstate = { tried: 0, done: false, sel: null, matched: 0, merr: 0, order: [], msel: null };
  const b = curBlock();
  let body = "";
  const qtext = item.q ? `<div class="qtext">${item.q.replace(/___/g, '<span class="blank">___</span>')}</div>` : "";
  const qzh = S.lang === "zh" && item.qzh ? `<div class="qzh">${esc(item.qzh)}</div>` : "";
  const sayBtn = item.say && hasTTS() ? `<button class="speakbtn" onclick="speak(${JSON.stringify(item.say).replace(/"/g, "&quot;")},{en:${!!item.en}})">${t("listen")}</button>` : "";
  switch (item.type) {
    case "qcm": case "vf": {
      const opts = item.type === "vf" ? t("q_vf") : item.opts;
      const two = opts.every((o) => String(o).length <= 14) && opts.length <= 4;
      body = `<div class="opts ${two ? "two" : ""}">${opts.map((o, i) => `<button class="opt" id="opt${i}" onclick="pickOpt(${i})">${o}</button>`).join("")}</div>`;
      break;
    }
    case "input": {
      body = inputHTML(item);
      break;
    }
    case "multi": {
      body = `<div class="multiwrap">${item.fields.map((f, i) => `<div class="mf"><label>${esc(f.label)}</label><input class="tinp" id="mf${i}" inputmode="${f.num ? "decimal" : "text"}" autocomplete="off"></div>`).join("")}</div>
      <button class="nextbtn checkbtn" onclick="checkMulti()">${t("validate")}</button>`;
      break;
    }
    case "match": {
      const left = shuffle(item.pairs.map((p, i) => ({ txt: p[0], i })));
      const right = shuffle(item.pairs.map((p, i) => ({ txt: p[1], i })));
      qstate.mleft = left; qstate.mright = right;
      body = `<div class="qzh">${t("matchHint")}</div><div class="matchgrid">
        <div>${left.map((x, k) => `<div class="mitem" id="ml${k}" data-i="${x.i}" onclick="mLeft(${k})" style="margin-bottom:8px">${esc(x.txt)}</div>`).join("")}</div>
        <div>${right.map((x, k) => `<div class="mitem" id="mr${k}" data-i="${x.i}" onclick="mRight(${k})" style="margin-bottom:8px">${esc(x.txt)}</div>`).join("")}</div></div>`;
      break;
    }
    case "order": {
      const idxs = shuffle(item.seq.map((_, i) => i));
      qstate.avail = idxs;
      body = `<div class="qzh">${t("orderHint")}</div>
        <div class="orderzone" id="ozone"><span class="ozhint">${t("clickOrder")}</span></div>
        <div class="chips" id="chips">${idxs.map((i, k) => `<button class="chip" id="ch${k}" onclick="chipPick(${k},${i})">${esc(item.seq[i])}</button>`).join("")}</div>
        <div class="row" style="margin-top:10px"><button class="sbtn" onclick="chipUndo()">↩ ${t("undo")}</button></div>
        <button class="nextbtn checkbtn hidden" id="ordercheck" onclick="checkOrder()">${t("validate")}</button>`;
      break;
    }
    case "dictee": {
      const tts = hasTTS();
      body = `<div class="center" style="margin:6px 0">
        ${tts ? `<button class="speakbtn" onclick="speak(${JSON.stringify(item.say).replace(/"/g, "&quot;")})">${t("listen")}</button>
        <button class="speakbtn" onclick="speak(${JSON.stringify(item.say).replace(/"/g, "&quot;")},{slow:true})">${t("listenSlow")}</button>`
          : `<div class="memoline" id="memoline">${esc(item.say)}</div><div class="qzh">${t("memoShow")}</div>`}
      </div>` + inputHTML(item);
      if (!tts) setTimeout(() => { const m = $id("memoline"); if (m) { m.textContent = "🙈 " + t("memoGone"); } }, 7000);
      break;
    }
  }
  app.innerHTML = sessHeader() + `<div class="qcard">${qtext}${qzh}${figHTML(item)}${sayBtn && item.type !== "dictee" ? `<div>${sayBtn}</div>` : ""}${body}<div id="fb"></div></div>`;
  const inp0 = $id("tin") || $id("mf0");
  if (inp0) inp0.focus();
  if (item.type === "dictee" && hasTTS()) setTimeout(() => speak(item.say), 400);
}
function inputHTML(item) {
  const needAcc = !item.num && !item.en && (item.comp || "").startsWith("fr") || item.type === "dictee";
  const accents = ["é", "è", "ê", "ë", "à", "â", "ç", "î", "ï", "ô", "û", "ù", "œ"];
  return `<div class="inpwrap">
    <input class="tinp" id="tin" placeholder="${t("inputPh")}" inputmode="${item.num ? "decimal" : "text"}" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkInput()">
    ${needAcc ? `<div class="accbar">${accents.map((a) => `<button class="acc" onclick="insAcc('${a}')">${a}</button>`).join("")}</div>` : ""}
    <button class="nextbtn checkbtn" onclick="checkInput()">${t("validate")}</button></div>`;
}
function insAcc(ch) { const i = $id("tin"); if (!i) return; const p = i.selectionStart || i.value.length; i.value = i.value.slice(0, p) + ch + i.value.slice(p); i.focus(); i.setSelectionRange(p + 1, p + 1); }

/* ---- 答题交互 ---- */
function credit4tries() { return qstate.tried === 1 ? 1 : 0.5; }
function ansTextOf(item) {
  switch (item.type) {
    case "qcm": return String(item.opts[item.a]);
    case "vf": return t("q_vf")[item.a ? 0 : 1];
    case "input": case "dictee": return item.acc[0];
    case "multi": return item.fields.map((f) => f.a).join(" · ");
    case "order": return item.seq.join(" → ");
    case "match": return item.pairs.map((p) => p.join("↔")).join(" · ");
  }
}
function plainQ(item) { return (item.q || (item.type === "dictee" ? "Dictée : " + item.say : "")).replace(/<[^>]+>/g, ""); }
function settle(correct, givenStr) {
  const item = curItem();
  qstate.done = true;
  const credit = correct ? credit4tries() : 0;
  sess.earned += credit; sess.perBlock[sess.bi].earned += credit;
  recordAnswer(item.comp, credit, sess.day);
  if (!correct || credit < 1) {
    if (!correct) sess.wrong.push({ comp: item.comp, q: plainQ(item), given: String(givenStr).slice(0, 80), ans: ansTextOf(item) });
  }
  const fb = $id("fb");
  const expl = item.exp ? `<div class="small" style="margin-top:4px">${item.exp}</div>` : "";
  if (correct) { blip("ok"); fb.innerHTML = `<div class="fb good"><b class="res">${credit === 1 ? "🎉 " + t("correct") : "💪 " + t("correctHalf")} +${credit === 1 ? "1" : "0,5"} pt</b>${expl}</div>` + nextBtnHTML(); }
  else { blip("bad"); fb.innerHTML = `<div class="fb bad"><b class="res">${t("wrong")} : ${esc(ansTextOf(item))}</b>${expl}</div>` + nextBtnHTML(); }
  const nb = $id("nextbtn"); if (nb) nb.focus();
}
function nextBtnHTML() {
  const last = sess.bi === sess.blocks.length - 1 && sess.qi === curBlock().items.length - 1;
  return `<button class="nextbtn" id="nextbtn" onclick="nextQuestion()">${last ? t("finish") : t("next")}</button>`;
}
function giveHint(msg) {
  blip("bad");
  $id("fb").innerHTML = `<div class="fb hint"><b class="res">🔍 ${t("hintTitle")}</b><div class="small">${msg || t("tryAgain")}</div></div>`;
}
function pickOpt(i) {
  if (qstate.done) return;
  const item = curItem();
  qstate.tried++;
  const ok = item.type === "vf" ? (i === 0) === item.a : i === item.a;
  const btn = $id("opt" + i);
  if (ok) {
    btn.classList.add("ok");
    document.querySelectorAll(".opt").forEach((b) => (b.disabled = true));
    settle(true, "");
  } else if (qstate.tried === 1) {
    btn.classList.add("bad"); btn.disabled = true;
    giveHint(item.hint || (S.lang === "zh" ? "不是这个,再想想!" : "Pas celle-là, réfléchis encore !"));
  } else {
    btn.classList.add("bad");
    document.querySelectorAll(".opt").forEach((b) => (b.disabled = true));
    const goodIdx = item.type === "vf" ? (item.a ? 0 : 1) : item.a;
    const gb = $id("opt" + goodIdx); if (gb) gb.classList.add("ok");
    settle(false, item.type === "vf" ? t("q_vf")[i] : item.opts[i]);
  }
}
function checkInput() {
  if (qstate.done) return;
  const item = curItem();
  const v = $id("tin").value;
  if (!v.trim()) return;
  qstate.tried++;
  const ok = checkAnswer(item, v);
  const inp = $id("tin");
  if (ok) { inp.classList.remove("bad"); inp.classList.add("ok"); inp.disabled = true; settle(true, v); }
  else if (qstate.tried === 1) { inp.classList.add("bad"); giveHint(item.hint || (item.exp && item.type !== "dictee" ? (S.lang === "zh" ? "检查拼写和重音,再试一次!" : "Vérifie l'orthographe et les accents !") : t("tryAgain"))); setTimeout(() => inp.classList.remove("bad"), 600); }
  else { inp.classList.add("bad"); inp.disabled = true; settle(false, v); }
}
function checkMulti() {
  if (qstate.done) return;
  const item = curItem();
  const vals = item.fields.map((_, i) => $id("mf" + i).value);
  if (vals.some((v) => !v.trim())) return;
  qstate.tried++;
  const ok = checkAnswer(item, vals);
  if (ok) { item.fields.forEach((_, i) => { const f = $id("mf" + i); f.classList.add("ok"); f.disabled = true; }); settle(true, vals.join(" · ")); }
  else if (qstate.tried === 1) { item.fields.forEach((f, i) => { const el = $id("mf" + i); const good = f.num ? Math.abs(parseNum(el.value) - parseNum(f.a)) < 1e-9 : normAns(el.value) === normAns(f.a); el.classList.toggle("bad", !good); el.classList.toggle("ok", good); }); giveHint(); }
  else { item.fields.forEach((_, i) => { $id("mf" + i).disabled = true; }); settle(false, vals.join(" · ")); }
}
function mLeft(k) { if (qstate.done) return; const el = $id("ml" + k); if (el.classList.contains("paired")) return; document.querySelectorAll("[id^=ml]").forEach((x) => x.classList.remove("sel")); el.classList.add("sel"); qstate.msel = k; }
function mRight(k) {
  if (qstate.done || qstate.msel === null) return;
  const item = curItem();
  const l = $id("ml" + qstate.msel), r = $id("mr" + k);
  if (r.classList.contains("paired")) return;
  if (l.dataset.i === r.dataset.i) {
    const colors = ["#2E8B62", "#3D8BFD", "#8B5CF6", "#E8503A", "#B07A1E"];
    const c = colors[qstate.matched % colors.length];
    [l, r].forEach((x) => { x.classList.remove("sel"); x.classList.add("paired"); x.style.background = c; x.style.color = "#fff"; });
    blip("click");
    qstate.matched++; qstate.msel = null;
    if (qstate.matched === item.pairs.length) {
      if (qstate.merr === 0) { qstate.tried = 1; settle(true, ""); }
      else if (qstate.merr <= 2) { qstate.tried = 2; settle(true, ""); }
      else settle(false, (S.lang === "zh" ? "配对错误 " : "erreurs : ") + qstate.merr);
    }
  } else {
    qstate.merr++;
    r.classList.add("bad"); l.classList.add("bad"); blip("bad");
    setTimeout(() => { r.classList.remove("bad"); l.classList.remove("bad"); l.classList.remove("sel"); }, 450);
    qstate.msel = null;
  }
}
function chipPick(k, i) {
  if (qstate.done) return;
  const ch = $id("ch" + k);
  if (ch.classList.contains("used")) return;
  ch.classList.add("used"); ch.disabled = true;
  qstate.order.push({ k, i });
  renderOrderZone();
}
function chipUndo() {
  if (qstate.done || !qstate.order.length) return;
  const last = qstate.order.pop();
  const ch = $id("ch" + last.k); ch.classList.remove("used"); ch.disabled = false;
  renderOrderZone();
}
function renderOrderZone() {
  const item = curItem();
  const z = $id("ozone");
  z.innerHTML = qstate.order.length ? qstate.order.map((o, n) => `<span class="ochip">${n + 1}. ${esc(item.seq[o.i])}</span>`).join("") : `<span class="ozhint">${t("clickOrder")}</span>`;
  $id("ordercheck").classList.toggle("hidden", qstate.order.length !== item.seq.length);
}
function checkOrder() {
  if (qstate.done) return;
  const item = curItem();
  qstate.tried++;
  const ok = qstate.order.every((o, n) => o.i === n);
  if (ok) settle(true, "");
  else if (qstate.tried === 1) {
    giveHint(S.lang === "zh" ? "顺序不对,想想哪一步应该在前面?(点撤销重排)" : "Pas le bon ordre… lequel vient en premier ?");
    while (qstate.order.length) chipUndo();
  } else settle(false, qstate.order.map((o) => item.seq[o.i]).join(" → "));
}

/* ---------- 结果页 ---------- */
function showResults() {
  const time = Math.round((Date.now() - sess.t0) / 1000);
  const score = sess.total ? Math.round(sess.earned / sess.total * 100) : 0;
  const res = finishDay(sess.day, { score, time, wrong: sess.wrong });
  const msg = score >= 95 ? t("perfect") : score >= 80 ? t("great") : score >= 60 ? t("good") : t("meh");
  const circ = 2 * Math.PI * 62;
  const breakdown = sess.perBlock.filter((b) => b.total > 0).map((b) => {
    const p = Math.round(b.earned / b.total * 100);
    return `<div class="bd"><span>${b.ic}</span><span style="flex:0 0 auto;min-width:105px">${b.label}</span><div class="bar"><i style="width:${p}%;background:${b.color}"></i></div><b>${p}%</b></div>`;
  }).join("");
  const wrongs = sess.wrong.length
    ? `<h2 class="sec">📝 ${t("wrongRecap")}</h2><div class="card recap">${sess.wrong.map((w) => `<div class="wrongitem"><div>${esc(w.q)}</div><div class="small"><span style="color:var(--bad)">✗ ${esc(w.given || "—")}</span> → <b style="color:var(--ok)">✓ ${esc(w.ans)}</b></div></div>`).join("")}</div>`
    : `<div class="card center" style="background:var(--leaf-l)">🏆 ${t("noWrong")}</div>`;
  const badgeHtml = res.newBadges.length ? `<h2 class="sec">🎖️ ${t("newBadge")}</h2><div class="badges">${res.newBadges.map((b) => badgeHTML(b, true, true)).join("")}</div>` : "";
  const nextPlan = sess.day < 30 ? PLAN.find((p) => p.day === sess.day + 1) : null;
  const tomorrow = nextPlan ? `<div class="card" style="background:var(--sky-l)"><b>🔭 ${t("tomorrow")}</b> : J${nextPlan.day} · ${nextPlan.ic} ${nextPlan.t[S.lang]}</div>` : "";
  app.innerHTML = topbar() + `<div class="card scorewrap">
    <h2 style="margin:4px 0">${t("score")} · ${t("todayTitle", { d: sess.day })}</h2>
    <div class="scircle"><svg width="150" height="150"><circle cx="75" cy="75" r="62" fill="none" stroke="#F3E8DA" stroke-width="13"/>
      <circle cx="75" cy="75" r="62" fill="none" stroke="${score >= 75 ? "var(--leaf)" : score >= 60 ? "var(--sun)" : "var(--coq)"}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ * (1 - score / 100)}" style="transition:stroke-dashoffset 1.2s ease"/></svg>
      <div class="val"><b>${score}</b><span class="muted small">/100</span></div></div>
    <div class="stars">${"⭐".repeat(res.stars)}${"☆".repeat(3 - res.stars)}</div>
    <div><span class="gain">${t("gainXp", { n: res.xpGain })}</span><span class="gain">⏱ ${Math.max(1, Math.round(time / 60))} ${t("pMin")}</span></div>
    <p style="font-weight:700;margin:8px 0 2px">${msg}</p></div>
    <h2 class="sec">📊 ${t("breakdown")}</h2><div class="card breakdown">${breakdown}</div>
    ${badgeHtml}${wrongs}${tomorrow}
    <button class="nextbtn" onclick="sess=null;go('home')" style="margin-top:16px">🏝️ ${t("backHome")}</button>`;
  if (score >= 75) { confetti(score >= 95 ? 130 : 70); blip("fanfare"); }
  window.scrollTo(0, 0);
}

/* ---------- 勋章页 ---------- */
function badgeHTML(b, unlocked, isNew) {
  return `<div class="badge ${unlocked ? "" : "off"} ${isNew ? "new" : ""}"><span class="bic">${b.ic}</span><b>${S.lang === "zh" ? b.zh : b.fr}</b><small>${S.lang === "zh" ? b.dzh : b.dfr}</small></div>`;
}
function badgesView() {
  app.innerHTML = topbar() + `<h2 class="sec">🎖️ ${t("badgesTitle")} · ${S.badges.length}/${BADGES.length}</h2>
  <div class="badges">${BADGES.map((b) => badgeHTML(b, S.badges.includes(b.id))).join("")}</div>
  <button class="nextbtn" onclick="go('home')" style="margin-top:16px">🏝️ ${t("backHome")}</button>`;
}

/* ---------- 结业证书 ---------- */
function diplomaView() {
  const { L } = levelOf(S.xp);
  app.innerHTML = topbar() + `<div class="diploma card">
    <div style="font-size:3rem">🌺🏅🌺</div>
    <h1>${t("diplomaTitle")}</h1>
    <p class="muted">L'île aux Coquelicots · CM1 → CM2 · ${new Date().getFullYear()}</p>
    <div class="nm">Tong Jingyi · 童童</div>
    <p>${t("diplomaBody")}</p>
    <p><b>${t("diplomaStars", { s: totalStars(), t: (S.lang === "zh" ? L.zh : L.fr) + " " + L.ic })}</b></p>
    <p class="small muted">${todayStr()}</p></div>
    <div class="row"><button class="bigbtn alt" onclick="window.print()">${t("print")}</button>
    <button class="sbtn" onclick="go('home')">🏝️ ${t("backHome")}</button></div>`;
}

/* ---------- 设置 ---------- */
function settingsView() {
  app.innerHTML = topbar() + `<h2 class="sec">⚙️ ${t("settings")}</h2><div class="card">
    <div class="setrow"><span class="lbl">🌐 ${t("sLang")}</span>
      <button class="sbtn" onclick="S.lang='zh';save();render()" ${S.lang === "zh" ? 'style="border-color:var(--coq)"' : ""}>中文</button>
      <button class="sbtn" onclick="S.lang='fr';save();render()" ${S.lang === "fr" ? 'style="border-color:var(--coq)"' : ""}>Français</button></div>
    <div class="setrow"><span class="lbl">🔔 ${t("sSound")}</span>
      <button class="sbtn" onclick="S.sound=!S.sound;save();render()">${S.sound ? "🔊 " + t("on") : "🔇 " + t("off")}</button></div>
    <div class="setrow"><span class="lbl">🗣️ ${t("sVoice")}<small>${hasTTS() ? "Web Speech fr-FR" : t("ttsNo")}</small></span>
      <button class="sbtn" onclick="speak('Bonjour Tongtong ! Bonnes vacances !')">${t("sVoiceBtn")}</button></div>
    <div class="setrow"><span class="lbl">🔑 ${t("sPin")}</span>
      <button class="sbtn" onclick="changePin()">${t("sPin")}</button></div>
    <div class="setrow"><span class="lbl">🗑️ ${t("sReset")}</span>
      <button class="sbtn warn" onclick="resetAll()">${t("sResetBtn")}</button></div>
  </div>
  <button class="nextbtn" onclick="go('home')" style="margin-top:14px">🏝️ ${t("backHome")}</button>`;
}
function changePin() {
  const cur = prompt(S.lang === "zh" ? "输入当前PIN" : "PIN actuel :");
  if (cur !== S.pin) { toast(t("pinBad")); return; }
  const np = prompt(t("sPinNew"));
  if (np && /^\d{4}$/.test(np)) { S.pin = np; save(); toast(t("saved")); }
}
function resetAll() {
  if (!confirm(t("sResetWarn"))) return;
  const pinCheck = prompt(S.lang === "zh" ? "输入家长PIN确认重置" : "PIN parents pour confirmer :");
  if (pinCheck !== S.pin) { toast(t("pinBad")); return; }
  localStorage.removeItem(STORE_KEY); S = DEFAULT_STATE(); save(); go("home");
}

/* ---------- 路由 ---------- */
function render() {
  switch (view.name) {
    case "home": return homeView();
    case "badges": return badgesView();
    case "diploma": return diplomaView();
    case "settings": return settingsView();
    case "parent": return parentView();
    default: return homeView();
  }
}

/* ---------- 启动 ---------- */
load();
initVoices();
render();

</script>
</body>
</html>
